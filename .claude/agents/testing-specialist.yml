## When Working on Agent Studio

- Agent Studio uses Playwright for E2E tests (`e2e/**/*.e2e.ts`)
- Test configuration is in `playwright.config.ts`
- Electron has three process contexts — main, renderer, preload — each needs a different test strategy
- IPC testing: mock `ipcMain.handle` and `ipcRenderer.invoke`, validate channel contracts
- Database: better-sqlite3 is synchronous — use in-memory databases for test isolation
- Claude CLI integration: mock subprocess spawning, assert on NDJSON stream parsing
- Follow Arrange/Act/Assert pattern consistently
- Use accessible selectors (getByRole, data-testid) — never CSS classes

## Anti-Patterns to Flag

- Over-mocking (testing mocks instead of real behavior)
- Flaky tests (fix or delete — never ignore)
- CSS selector soup (use semantic selectors)
- sleep() waits (use auto-waiting or explicit conditions)
- Snapshot abuse (review every snapshot change)
- Testing AI outputs literally (assert structure, not exact text)
