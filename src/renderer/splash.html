<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Atelier</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f1517;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        font-family: Georgia, 'Times New Roman', serif;
        -webkit-app-region: drag;
        user-select: none;
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        opacity: 0;
        animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      /* Logo Icon */
      .icon-container {
        width: 96px;
        height: 96px;
        animation: scaleIn 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        transform: scale(0.92);
        opacity: 0;
      }

      .icon-container img {
        width: 100%;
        height: 100%;
        border-radius: 20%;
        filter: drop-shadow(0 8px 32px rgba(184, 151, 106, 0.25));
      }

      /* Brand Name */
      .brand-name {
        font-size: 20px;
        font-weight: 400;
        color: #c8b89a;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0;
        animation: slideUp 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }

      /* Decorative divider */
      .divider {
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(184, 151, 106, 0.4), transparent);
        animation: expandLine 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      }

      /* Subtitle message */
      .subtitle {
        font-size: 13px;
        font-weight: 400;
        color: #8a9a9e;
        letter-spacing: 0.08em;
        font-style: italic;
        opacity: 0;
        animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }

      /* Progress bar */
      .progress-track {
        width: 120px;
        height: 2px;
        background: rgba(184, 151, 106, 0.08);
        border-radius: 1px;
        overflow: hidden;
        opacity: 0;
        animation: fadeIn 1s ease 1.5s forwards;
      }

      .progress-bar {
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, #8b6f4a, #b8976a, #c8b89a);
        border-radius: 1px;
        animation: shimmerProgress 2s ease-in-out infinite;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes scaleIn {
        from {
          transform: scale(0.92);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes expandLine {
        from {
          width: 0;
        }
        to {
          width: 120px;
        }
      }

      @keyframes shimmerProgress {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(250%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
    </style>
  </head>
