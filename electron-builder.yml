appId: com.code-atelier.app
productName: Code Atelier
directories:
  buildResources: build
files:
  # Whitelist approach — include ONLY what the packaged app needs.
  # node_modules are copied separately via afterPack hook to bypass
  # electron-builder's dependency resolver (which OOMs on large trees).
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: src/main/hooks
    to: hooks
    filter:
      - '*.sh'
afterPack: build/afterPack.js
# ASAR disabled — app loads from loose files in Resources/app/.
# Required because node_modules are copied via afterPack (not through
# electron-builder's dependency resolver), so they have no ASAR header entries.
# Security: macOS code signing + hardened runtime + notarization still protect integrity.
asar: false
# N-API prebuilts don't need rebuilding — npmRebuild: false because
# electron-builder's dep resolver is bypassed (no deps in package.json during build).
npmRebuild: false
win:
  executableName: code-atelier
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # NOTE: hardened runtime + notarization disabled due to incompatibility with
  # native .node binaries (errSecInternalComponent on dist codesign).
  # better-sqlite3 v13 uses N-API prebuilts (no Electron-specific rebuild needed).
  # App is still signed; hardened runtime is optional for DMG distribution.
  # See: https://github.com/electron/electron/issues/32910
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  title: '${productName}'
  background: build/background.png
  iconSize: 120
  iconTextSize: 13
  window:
    width: 660
    height: 400
  contents:
    - x: 175
      y: 210
      type: file
    - x: 485
      y: 210
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: codeatelier.dev
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
electronVersion: 43.3.0
publish:
  provider: github
  owner: anthropics
  repo: AgentStudio
  private: true
