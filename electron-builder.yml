appId: com.code-atelier.app
productName: Code Atelier
directories:
  buildResources: build
files:
  # Whitelist approach — include ONLY what the packaged app needs.
  # node_modules are copied separately via afterPack hook to bypass
  # electron-builder's dependency resolver (which OOMs on large trees).
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: src/main/hooks
    to: hooks
    filter:
      - '*.sh'
afterPack: build/afterPack.js
# ASAR disabled — app loads from loose files in Resources/app/.
# Required because node_modules are copied via afterPack (not through
# electron-builder's dependency resolver), so they have no ASAR header entries.
# Security: macOS code signing + hardened runtime + notarization still protect integrity.
asar: false
# Native rebuild handled manually in build-mac.sh (Step 2b) because
# electron-builder's dep resolver is bypassed (no deps in package.json during build).
npmRebuild: false
win:
  executableName: code-atelier
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
  background: build/background.png
  iconSize: 80
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: codeatelier.dev
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
electronVersion: 41.7.0
publish:
  provider: github
  owner: anthropics
  repo: AgentStudio
  private: true
