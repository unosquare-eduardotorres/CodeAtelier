<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: deep indigo to dark navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Bot stroke color -->
    <linearGradient id="botStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (inset 100px for macOS dock padding) -->
  <rect x="100" y="100" width="824" height="824" rx="183" ry="183" fill="url(#bg)"/>

  <!-- Antenna nub (small rectangle on top) -->
  <rect x="487" y="300" width="52" height="42" rx="11" ry="11"
        fill="none" stroke="url(#botStroke)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Antenna stem -->
  <line x1="512" y1="342" x2="512" y2="380"
        stroke="url(#botStroke)" stroke-width="28" stroke-linecap="round"/>

  <!-- Robot head (rounded rectangle) -->
  <rect x="326" y="380" width="373" height="290" rx="64" ry="64"
        fill="none" stroke="url(#botStroke)" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left eye (small rounded square) -->
  <rect x="414" y="477" width="58" height="58" rx="13" ry="13"
        fill="#a5b4fc"/>

  <!-- Right eye (small rounded square) -->
  <rect x="553" y="477" width="58" height="58" rx="13" ry="13"
        fill="#a5b4fc"/>
</svg>
