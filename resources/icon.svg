<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Apple HIG: 824×824 squircle centered in 1024, 100px transparent gutter -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1C272D"/>

  <!-- Triple diamond — compact, thick strokes, centered with breathing room -->
  <g transform="translate(512,512)">
    <!-- Outer diamond — bold primary stroke -->
    <rect x="-185" y="-185" width="370" height="370" rx="16" transform="rotate(45)" stroke="#B8976A" stroke-width="28" fill="none"/>
    <!-- Middle diamond — visible secondary -->
    <rect x="-155" y="-155" width="310" height="310" rx="10" transform="rotate(45)" stroke="#B8976A" stroke-width="12" fill="none" opacity="0.5"/>
    <!-- Inner diamond — subtle tertiary with translucent fill for depth -->
    <rect x="-128" y="-128" width="256" height="256" rx="8" transform="rotate(45)" stroke="#B8976A" stroke-width="7" fill="#B8976A" fill-opacity="0.04" opacity="0.4"/>
  </g>

  <!-- Cardinal jewels (copper) — on diamond vertices -->
  <circle cx="512" cy="250" r="30" fill="#C4714A"/>
  <circle cx="512" cy="250" r="18" fill="#D4885A" opacity="0.6"/>
  <circle cx="512" cy="250" r="9" fill="#E8A070" opacity="0.4"/>
  <circle cx="512" cy="774" r="28" fill="#C4714A" opacity="0.85"/>
  <circle cx="250" cy="512" r="28" fill="#C4714A" opacity="0.8"/>
  <circle cx="774" cy="512" r="28" fill="#C4714A" opacity="0.8"/>

  <!-- Diagonal jewels (gold) — between vertices -->
  <circle cx="300" cy="362" r="18" fill="#B8976A" opacity="0.6"/>
  <circle cx="724" cy="362" r="18" fill="#B8976A" opacity="0.6"/>
  <circle cx="300" cy="662" r="18" fill="#B8976A" opacity="0.55"/>
  <circle cx="724" cy="662" r="18" fill="#B8976A" opacity="0.55"/>

  <!-- Tick marks at cardinal points -->
  <line x1="512" y1="286" x2="512" y2="324" stroke="#B8976A" stroke-width="3" opacity="0.25"/>
  <line x1="512" y1="700" x2="512" y2="738" stroke="#B8976A" stroke-width="3" opacity="0.2"/>
  <line x1="282" y1="512" x2="320" y2="512" stroke="#B8976A" stroke-width="3" opacity="0.2"/>
  <line x1="704" y1="512" x2="742" y2="512" stroke="#B8976A" stroke-width="3" opacity="0.2"/>

  <!-- Code brackets — extra bold -->
  <text x="512" y="542" fill="#C8B89A" font-size="140" font-family="JetBrains Mono,Menlo,monospace" font-weight="800" text-anchor="middle" letter-spacing="-4" stroke="#C8B89A" stroke-width="5">&lt;/&gt;</text>
</svg>