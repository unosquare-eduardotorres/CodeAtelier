<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: deep indigo to dark navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Bot stroke color -->
    <linearGradient id="botStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Antenna nub (small rectangle on top) -->
  <rect x="480" y="248" width="64" height="52" rx="14" ry="14"
        fill="none" stroke="url(#botStroke)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Antenna stem -->
  <line x1="512" y1="300" x2="512" y2="348"
        stroke="url(#botStroke)" stroke-width="32" stroke-linecap="round"/>

  <!-- Robot head (rounded rectangle) -->
  <rect x="280" y="348" width="464" height="360" rx="80" ry="80"
        fill="none" stroke="url(#botStroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left eye (small rounded square) -->
  <rect x="390" y="468" width="72" height="72" rx="16" ry="16"
        fill="#a5b4fc"/>

  <!-- Right eye (small rounded square) -->
  <rect x="562" y="468" width="72" height="72" rx="16" ry="16"
        fill="#a5b4fc"/>
</svg>
